<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kova — an AI that makes stuff</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Kova</div>
    <div class="tagline">describe it, Kova makes it</div>
  </header>

  <main class="layout">
    <section class="composer">
      <label for="prompt">What should Kova make?</label>
      <textarea id="prompt" placeholder="e.g. a pomodoro timer with a progress ring, or a color palette generator with hex codes"></textarea>

      <div class="examples" id="examples">
        <span>Try:</span>
        <button type="button" class="chip">a pomodoro timer</button>
        <button type="button" class="chip">a color palette generator</button>
        <button type="button" class="chip">a tic-tac-toe game</button>
        <button type="button" class="chip">a markdown previewer</button>
        <button type="button" class="chip">a habit tracker grid</button>
      </div>

      <button id="generate" type="button">Make it</button>
      <p id="error" class="error" hidden></p>

      <div id="refine-box" class="refine-box" hidden>
        <label for="refine">Refine it</label>
        <div class="refine-row">
          <input id="refine" type="text" placeholder="e.g. make the buttons rounder, add a dark mode toggle" />
          <button id="refine-btn" type="button">Update</button>
        </div>
      </div>
    </section>

    <section class="result" id="result" hidden>
      <div class="result-tabs">
        <button type="button" class="tab active" data-tab="preview">Preview</button>
        <button type="button" class="tab" data-tab="code">Code</button>
        <div class="spacer"></div>
        <button type="button" id="download" class="tab-action">Download .html</button>
      </div>

      <div class="result-body">
        <iframe id="preview" title="Generated app preview" sandbox="allow-scripts allow-modals allow-forms"></iframe>
        <pre id="code-view" hidden><code id="code-text"></code></pre>
      </div>
    </section>

    <section class="empty-state" id="empty-state">
      <div class="empty-icon">✦</div>
      <p>Describe an idea above and Kova will build a working mini app for it, right in your browser.</p>
    </section>
  </main>

  <div id="loading" class="loading" hidden>
    <div class="spinner"></div>
    <span id="loading-text">Kova is building it…</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
